name: publish

# Publishes to PyPI when a GitHub release is published from a v* tag.
# Uses PyPI trusted publishing (OIDC): no API tokens are stored in secrets.
on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Check tag matches project version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          test "v${version}" = "${{ github.event.release.tag_name }}" \
            || { echo "Tag ${{ github.event.release.tag_name }} != v${version}"; exit 1; }
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy --strict src
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ritta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
